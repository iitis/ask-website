<header class="main-header content-wrapper">

  <input type="checkbox" id="menu-checkbox" />

  <nav class="nav-main">

    <a class="blog-logo" href="{{ site.baseurl }}/">{{ site.title }}</a>

    {% for my_page in site.pages %}
      {% if my_page.active %}
        {% comment %}nav_title pozwala skrócić etykietę, gdy pełny tytuł nie mieści się w pasku{% endcomment %}
        <a href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.nav_title | default: my_page.title }}</a>
      {% endif %}
    {% endfor %}

    <label for="menu-checkbox" class="toggle-button" data-open="☰" data-close="☰" onclick></label>
  </nav>

</header>
